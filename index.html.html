function graphBody(key,unit,label){var a=measurements.filter(function(x){return x[key]!=null}).sort(function(x,y){return x.date<y.date?-1:1});if(a.length<2)return '<div class="card"><h2>'+label+'</h2><p class="sub">Grafik akan muncul setelah ada minimal dua pengukuran.</p></div>';var min=Math.min.apply(0,a.map(function(x){return x[key]})),max=Math.max.apply(0,a.map(function(x){return x[key]}));if(min===max){min-=1;max+=1}var pts=a.map(function(x,i){return (12+i*276/(a.length-1))+','+(100-(x[key]-min)*70/(max-min))}).join(' ');return '<div class="card"><h2>'+label+'</h2><svg viewBox="0 0 300 120" width="100%"><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="3"/>'+a.map(function(x,i){return '<circle cx="'+(12+i*276/(a.length-1))+'" cy="'+(100-(x[key]-min)*70/(max-min))+'" r="4" fill="var(--ac)"/>'}).join('')+'</svg><div class="sub">Awal: '+a[0][key]+' '+unit+' · Terbaru: '+a[a.length-1][key]+' '+unit+' · Perubahan: '+(a[a.length-1][key]-a[0][key]).toFixed(1)+' '+unit+'</div></div>'}

window.add=function(){var oldLen=D.length;originalAdd();if(D.length>oldLen){var x=D[D.length-1],w=document.getElementById("snapWeight"),h=document.getElementById("snapHeight");if(w&&w.value)x.bodyWeight=Number(w.value);if(h&&h.value)x.bodyHeight=Number(h.value);persist()}};

addCss();
openDB().then(function(){return idbGet()}).then(function(saved){if(saved){D=saved.D||D;P=saved.P||P;profile=saved.profile||profile;measurements=saved.measurements||[]}else{try{var oldD=JSON.parse(localStorage.getItem(K)||"[]"),oldP=JSON.parse(localStorage.getItem(K+".p")||"[]");if(oldD.length)D=oldD;if(oldP.length)P=oldP}catch(e){}return persist()}}).then(function(){go("home")}).catch(function(e){status("Penyimpanan lokal tidak tersedia");console.error(e);go("home")});
})();

<style id="integrated-levelup-style">
#nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;overflow:visible}

.lv-hero{padding:20px;background:linear-gradient(135deg,rgba(10,132,255,.18),rgba(170,90,240,.13));border:1px solid var(--gb);border-radius:26px;margin-bottom:12px}

<script>
(function(){
"use strict";
var muscleDefs=[
 {id:"chest",name:"Chest",old:"chest"},
 {id:"back",name:"Back",old:"back"},
 {id:"shoulders",name:"Shoulders",old:"shoulder"},
 {id:"biceps",name:"Biceps",old:"biceps"},
 {id:"triceps",name:"Triceps",old:"triceps"},
 {id:"forearms",name:"Forearms",old:"forearm"},
 {id:"abs",name:"Abs / Core",old:"core"},
 {id:"quads",name:"Quadriceps",old:"legs"},
 {id:"hams",name:"Hamstrings",old:"legs"},
 {id:"glutes",name:"Glutes",old:"glutes"},
 {id:"calves",name:"Calves",old:"legs"},
 {id:"traps",name:"Traps",old:"traps"}
];
var ranks=[
 ["Warrior",0,"#a0693f","linear-gradient(135deg,#b9825a,#7d4e2d)","#fff"],
 ["Elite",400,"#5c6068","linear-gradient(135deg,#7a7f88,#44474e)","#fff"],
 ["Master",1200,"#ffd60a","linear-gradient(135deg,#ffe45c,#f5c400)","#3a2e00"],
 ["Grandmaster",3000,"#c9ced6","linear-gradient(110deg,#aeb4be,#f6f8fb 25%,#9aa1ac 45%,#fbfcfe 60%,#aab1bc)","#20242b"],
 ["Epic",6000,"#10b981","linear-gradient(135deg,#34d399,#059669)","#fff"],
 ["Legend",10000,"#e8b100","linear-gradient(135deg,#ffd75e,#c8901a)","#3a2800"],
 ["Mythic",16000,"#8b5cf6","linear-gradient(135deg,#a78bfa,#6d3fe0)","#fff"],
 ["Mythic Immortal",25000,"#e11d48","linear-gradient(135deg,#ff4d6d,#b3122e)","#fff"]
];
var goal=localStorage.getItem("gymtracker.goal")||"maintain";
var activeMuscle="chest",period="all",noticeTimer=null;
function fmt(n){return Math.round(n||0).toLocaleString("id-ID")}
function safe(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rankIndex(x,scale){var idx=0;ranks.forEach(function(r,i){if(x>=r[1]*scale)idx=i});return idx}
function profileData(){
 var w=70,h=170,age=0;
 try{
  var raw=localStorage.getItem("gymtracker.v1.profile");
  if(raw){var p=JSON.parse(raw);w=Number(p.weight)||w;h=Number(p.height)||h;age=Number(p.age)||0}
 }catch(e){}
 return {w:w,h:h,age:age};
}
function muscleForLog(l){
 var m=String(l.m||"").toLowerCase(),e=String(l.e||"").toLowerCase();
 if(m==="chest")return "chest";
 if(m==="back")return "back";
 if(m==="shoulder"||m==="shoulders")return "shoulders";
 if(m==="biceps")return "biceps";
 if(m==="triceps")return "triceps";
 if(m==="forearm"||m==="forearms")return "forearms";
 if(m==="traps")return "traps";
 if(m==="glutes"||/hip thrust|glute|kickback|bridge/.test(e))return "glutes";
 if(m==="core"||/crunch|plank|leg raise|russian twist|ab wheel/.test(e))return "abs";
 if(m==="legs"){
  if(/calf|calves|standing calf|seated calf/.test(e))return "calves";
  if(/leg curl|romanian|stiff leg|good morning|nordic|hamstring/.test(e))return "hams";
  if(/hip thrust|glute|kickback|bridge/.test(e))return "glutes";
  return "quads";
 }
 return "chest";
}
function score(l){
 var p=profileData(),ref=(p.w+22*Math.pow(p.h/100,2))/2;
 var weight=Number(l.w)>0?Number(l.w):.6*p.w;
 return ((weight*(1+(Number(l.r)||0)/30))/ref)*(Number(l.s)||0)*10;
}
function muscleStats(){
 var xp={};muscleDefs.forEach(function(m){xp[m.id]=0});
 (window.D||[]).forEach(function(l){var m=muscleForLog(l);xp[m]=(xp[m]||0)+score(l)});
 return muscleDefs.map(function(m){
  var points=xp[m.id]||0,level=rankIndex(points,1/6)+1,ri=rankIndex(points,1/6);
  var next=ranks[ri+1],current=ranks[ri],lower=current[1]*6,upper=next?next[1]*6:Infinity;
  return {id:m.id,name:m.name,old:m.old,xp:points,level:level,rank:current[0],rankIndex:ri,color:current[2],gradient:current[3],text:current[4],next:next,progress:next?Math.max(0,Math.min(100,(points-lower)/(upper-lower)*100)):100,needed:next?Math.max(0,upper-points):0};
 });
}
function overall(){
 var a=muscleStats(),avg=a.reduce(function(t,m){return t+m.level},0)/a.length;
 var avgXP=Math.max(0,(avg-1)*2400),idx=rankIndex(avgXP,1/6),r=ranks[idx],n=ranks[idx+1],low=r[1]*6,high=n?n[1]*6:Infinity;
 return {avg:avg,xp:a.reduce(function(t,m){return t+m.xp},0),avgXP:avgXP,rank:r[0],rankIndex:idx,rankData:r,next:n,progress:n?Math.max(0,Math.min(100,(avgXP-low)/(high-low)*100)):100,needed:n?Math.max(0,high-avgXP):0,muscles:a};
}
function notify(t){var el=document.getElementById("lvNotice");if(!el)return;el.textContent=t;el.classList.add("show");clearTimeout(noticeTimer);noticeTimer=setTimeout(function(){el.classList.remove("show")},2800)}
function logRankSnapshot(){var o=overall();return {rank:o.rank,levels:o.muscles.reduce(function(a,m){a[m.id]=m.level;return a},{})}}
var before=logRankSnapshot();
function checkRankUp(){
 var after=logRankSnapshot(),up=[];
 if(after.rank!==before.rank&&ranks.findIndex(function(x){return x[0]===after.rank})>ranks.findIndex(function(x){return x[0]===before.rank}))up.push("Overall Rank naik ke "+after.rank+"!");
 after.levels && Object.keys(after.levels).forEach(function(k){if(after.levels[k]>(before.levels[k]||1))up.push(muscleDefs.find(function(x){return x.id===k}).name+" naik ke Level "+after.levels[k])});
 before=after;if(up.length)notify("🏆 "+up.join(" · "));
}
function progressBar(p,c){return '<div class="lv-progress"><i style="width:'+p+'%;background:'+c+'"></i></div>'}
function rankPill(r){return '<span class="rank-pill" style="background:'+r[3]+';color:'+r[4]+'">'+r[0]+'</span>'}
function overallCard(){
 var o=overall(),r=o.rankData;
 return '<div class="lv-hero"><div class="lv-muted">OVERALL RANK · RATA-RATA 12 KELOMPOK OTOT</div>'+rankPill(r)+'<div class="lv-grid"><div class="lv-stat"><span class="lv-muted">Rata-rata level</span><b>Lv '+o.avg.toFixed(1)+'</b></div><div class="lv-stat"><span class="lv-muted">Total XP seluruh otot</span><b>'+fmt(o.xp)+'</b></div></div>'+progressBar(o.progress,r[2])+'<div class="lv-muted">'+(o.next?fmt(o.needed)+" XP rata-rata ekuivalen menuju "+o.next[0]:"Rank tertinggi tercapai")+'</div></div>';
}
function muscleCard(m){
 return '<div class="lv-muscle" data-muscle="'+m.id+'"><div class="lv-muscle-head"><b>'+m.name+' · Lv '+m.level+'</b><span class="lv-chip" style="background:'+m.gradient+';color:'+m.text+'">'+m.rank+'</span></div><div class="lv-muted">'+fmt(m.xp)+' XP · '+(m.next?fmt(m.needed)+' XP ke '+m.next[0]:'Rank maksimum')+'</div>'+progressBar(m.progress,m.color)+'</div>';
}
function homePage(){
 var o=overall(),last=(window.D||[]).filter(function(x){return !x.isDemo}).slice().sort(function(a,b){return (a.d||"")<(b.d||"")?1:-1})[0];
 return overallCard()+'<div class="card"><h2>Ringkasan latihan</h2><div class="lv-grid"><div class="lv-stat"><span class="lv-muted">Catatan latihan</span><b>'+(window.D||[]).filter(function(x){return !x.isDemo}).length+'</b></div><div class="lv-stat"><span class="lv-muted">Kelompok otot</span><b>12</b></div></div><div class="lv-list"><b>Latihan terakhir</b><p class="sub">'+(last?safe(last.e)+' · '+safe(last.d):'Belum ada catatan latihan.')+'</p></div><button class="btn" onclick="openSheet()">+ Catat latihan</button></div><div class="card"><h2>Muscle Rank</h2><p class="sub">Perkembangan tiap kelompok otot dihitung dari catatan latihan.</p>'+o.muscles.slice().sort(function(a,b){return b.level-a.level}).slice(0,4).map(muscleCard).join('')+'<button class="btn l" onclick="go(\'body\')">Lihat semua otot</button></div>';
}
function bodyPage(){
 var o=overall();
 return '<div class="card"><h2>Anatomi interaktif</h2><p class="sub">Pilih otot melalui ilustrasi anatomi di bawah. Warna menandakan rank otot.</p><div class="lv-two"><button class="lv-chip '+(window.bv==="f"?'active':'')+'" onclick="setBv(\'f\')">Depan</button><button class="lv-chip '+(window.bv==="b"?'active':'')+'" onclick="setBv(\'b\')">Belakang</button></div></div><div class="card" id="muscleDetail"><h2>'+o.muscles.find(function(m){return m.id===activeMuscle}).name+'</h2><p class="sub">Pilih salah satu kelompok otot untuk melihat detail.</p></div><div class="card"><h2>Muscle Rank · 12 kelompok</h2>'+o.muscles.map(muscleCard).join('')+'</div>';
}
function selectedDetail(){
 var m=muscleStats().find(function(x){return x.id===activeMuscle});if(!m)return;

function nutriCalc(st,key){
 var w=+st.w,h=+st.h,a=+st.age;
 if(!(w>0&&h>0&&a>0))return {err:"Isi usia, berat, dan tinggi badan untuk melihat hasil."};
 if(a<18)return {err:"Kalkulator ini dibuat untuk usia 18 tahun ke atas. Untuk remaja, konsultasikan kebutuhan gizi ke dokter atau ahli gizi."};
 var bmr=10*w+6.25*h-5*a+(st.sex==="m"?5:-161),tdee=bmr*(+st.act||1.55),pr=NUTRI_PROGRAMS[key];
 var kcal=tdee*(1+pr.adj);if(kcal<bmr)kcal=bmr;kcal=Math.round(kcal);
 var p=pr.prot*w,f=kcal*.25/9,c=Math.max(0,(kcal-p*4-f*9)/4);
 return {bmr:bmr,tdee:tdee,kcal:kcal,p:p,f:f,c:c,water:w*.035,weekly:(kcal-tdee)*7/7700,note:pr.note,label:pr.label};
}

 var nv=$("nav"),ind=nv.querySelector(".nav-ind"),b=nv.querySelector("button.on");if(!ind||!b)return;
 if(instant)ind.style.transition="none";
 ind.style.width=b.offsetWidth+"px";ind.style.height=b.offsetHeight+"px";
 ind.style.transform="translate("+b.offsetLeft+"px,"+b.offsetTop+"px)";
 if(instant){void ind.offsetWidth;ind.style.transition=""}
}

function navItems(){
 var items=[["home","⌂","Home"],["body","◉","Tubuh"],["log","＋","Catatan"],["prog","↗","Progres"],["coach","✦","Coach"],["profile","⚙","Profil"]];
 var nv=$("nav"),ind=nv.querySelector(".nav-ind"),first=!ind;
 if(first){ind=document.createElement("span");ind.className="nav-ind";nv.appendChild(ind)}
 Array.prototype.slice.call(nv.querySelectorAll("button")).forEach(function(b){b.remove()});
 nv.insertAdjacentHTML("beforeend",items.map(function(x){return '<button type="button" class="'+(tab===x[0]?'on':'')+'" data-integrated-tab="'+x[0]+'"><span style="font-size:18px;line-height:1.2">'+x[1]+'</span>'+x[2]+'</button>'}).join(''));
 moveNavInd(first);
}
function renderIntegrated(){
 var titleMap={home:["Home","Ringkasan latihan dan pencapaian"],body:["Tubuh","Anatomi dan Muscle Rank"],log:["Catatan",(window.D||[]).length+" catatan latihan"],prog:["Progres","Grafik, foto, dan pengukuran"],coach:["Coach","Analisis dan kebiasaan sehat"],profile:["Profil","Data pengguna dan cadangan"]};
 var t=titleMap[tab]?tab:"home";if(t!==tab)tab=t;
 $("title").textContent=titleMap[t][0];$("hs").textContent=titleMap[t][1];
 $("anatw").style.display=t==="body"?"block":"none";
 $("phw").style.display=t==="prog"?"block":"none";
 if(t==="body"){
  var old=tab;tab="log";renderAnat();tab=old;
  applyAnatomyRankColors();
  muscleCardsRender();
  $("app").innerHTML=bodyPage();
  selectedDetail();
  applyAnatomyRankColors();
 }else if(t==="home"){$("app").innerHTML=homePage()}
 else if(t==="log"){$("app").innerHTML=viewLog()}
 else if(t==="prog"){$("app").innerHTML=viewProg();if(typeof renderPhotos==="function")renderPhotos();if(typeof graphBody==="function")graphBody()}
 else if(t==="coach"){$("app").innerHTML=coachPage()}
 else if(t==="profile"){$("app").innerHTML=profilePage()}
 else {$("app").innerHTML=viewRec()}
 navItems();
}
window.go=function(t){var same=(t===tab);tab=t;window.scrollTo(0,0);renderIntegrated();
 if(!same){var ap=document.getElementById("app");ap.style.animation="none";void ap.offsetWidth;ap.style.animation=""}};
window.render=renderIntegrated;
window.setBv=function(v){bv=v;renderIntegrated();if(tab==="body")requestAnimationFrame(applyAnatomyRankColors)};
var originalDel=window.del;
if(typeof originalDel==="function")window.del=function(id){var old=logRankSnapshot();originalDel(id);before=old;checkRankUp();renderIntegrated()};
var originalAdd=window.add;
if(typeof originalAdd==="function"){
 window.add=function(){var old=logRankSnapshot();originalAdd();before=old;checkRankUp();renderIntegrated()};
 var saveBtn=document.getElementById("fsv");if(saveBtn)saveBtn.onclick=window.add;
}
document.addEventListener("click",function(e){
 var nav=e.target.closest("[data-integrated-tab]");if(nav){window.go(nav.getAttribute("data-integrated-tab"));return}
 var m=e.target.closest("[data-muscle]");if(m){activeMuscle=m.getAttribute("data-muscle");renderIntegrated();return}
 var g=e.target.closest("[data-goal]");if(g){goal=g.getAttribute("data-goal");localStorage.setItem("gymtracker.goal",goal);renderIntegrated();notify("Tujuan latihan disimpan: "+goal);return}
});
document.addEventListener("click",function(e){
 var g=e.target.closest("#anatw .mu");if(g){
  var old=g.getAttribute("data-m"),map={chest:"chest",back:"back",shoulder:"shoulders",biceps:"biceps",triceps:"triceps",forearm:"forearms",traps:"traps",glutes:"glutes",legs:"quads",core:"abs"};
  activeMuscle=map[old]||"quads";renderIntegrated();
 }
});
function onNutriInput(e){var t=e.target;if(t&&t.closest&&t.closest("#nuForm")){saveNutri();var r=document.getElementById("nuResult");if(r)r.innerHTML=nutriResultHTML()}}
document.addEventListener("input",onNutriInput);
document.addEventListener("change",onNutriInput);
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-split]");if(!b)return;
 splitSel=b.getAttribute("data-split");
 Array.prototype.forEach.call(document.querySelectorAll("[data-split]"),function(x){x.classList.toggle("active",x===b)});
 var p=document.getElementById("splitPanel");
 if(p){p.innerHTML=splitPanelHTML();p.style.animation="none";void p.offsetWidth;p.style.animation=""}
});
var oldRenderAnat=window.renderAnat;
if(typeof oldRenderAnat==="function"){
 window.renderAnat=function(){var t=tab;tab="log";oldRenderAnat();tab=t;applyAnatomyRankColors();muscleCardsRender()};
}
var oldSave=window.save;
window.save=function(){if(typeof oldSave==="function")oldSave();};
var oldRender=window.render;
before=logRankSnapshot();
renderIntegrated();
})();
</script>
